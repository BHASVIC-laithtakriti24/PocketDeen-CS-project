
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="designStyles.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketDeen</title>
</head>

<body>

<!-- HEADER -->
<div class="titleSquare">
  <h1>PocketDeen</h1>
</div>


<!-- SUPPLICATIONS SECTION -->
<div class="supplications-section">
  <div class="supplicationsBox">supplications</div>
  <div class="supplicationsBox">(text of supplications)</div>
</div>

<!-- ARTICLES SECTION -->
<div class="articles-box">Articles</div>

<!-- NAV ICONS -->
<div class="nav-icons"> 
  <div class="nav-item">Prayer</div>
  <div class="nav-item">Quran</div>
  <div class="nav-item">Navigation</div>
  <div class="nav-item">community support</div>
</div>

<!-- PRAYER TIMES -->
<div class="prayer-times">
  <table id="prayerTable">
    <tr><th>Prayer</th><th>Time</th><th>CountDown</th></tr>
    <tr><td>Fajr</td><td id = "fajr">Loading...</td><td id="timer">Loading...</td></tr>
    <tr><td>Dhuhr</td><td id = "dhuhr">Loading...</td></tr>
    <tr><td>Asr</td><td id = "asr">Loading...</td></tr>
    <tr><td>Maghrib</td><td id = "maghrib">Loading...</td></tr>
    <tr><td>Isha</td><td id = "isha">Loading...</td></tr>
  </table>
</div>


<script src = "prayerScript.js"></script>


</body>
</html>
